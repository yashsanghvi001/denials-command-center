upstream api {
    server api:8080;
    # Reuse connections to the API; without this every proxied request opens a new TCP connection,
    # which runs out of local ports under sustained load.
    keepalive 64;
}

# One Cache-Control per path, set at server level so the security headers below are never dropped
# (nginx stops inheriting add_header as soon as a location declares its own).
map $uri $cache_control {
    ~^/api/    "no-store";
    ~^/assets/ "public, max-age=31536000, immutable";
    default    "no-cache";
}

server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;
    client_max_body_size 64k;

    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;

    location /api/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The AI evaluation makes one model call per labeled denial and can run for a few minutes.
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri /index.html;
    }
}
